<!doctype html>
<html lang="es" class="me">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1B4B">
  <!-- Metadatos estáticos: WhatsApp/Facebook no ejecutan JS. En la app real el servidor debe rellenarlos desde demoData. -->
  <title>Misión Luis Arturo · ¡Cumple 8!</title>
  <meta name="description" content="¡Estás invitado a la Misión Luis Arturo! Una película espacial para celebrar sus 8 años: fecha, lugar y confirmación de asistencia.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Misión Luis Arturo · ¡Cumple 8!">
  <meta property="og:description" content="Mantén presionado para encender motores y únete a la tripulación.">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/overlay.css">
  <link rel="stylesheet" href="css/bitacora.css">
  <link rel="stylesheet" href="css/crew.css">
  <link rel="stylesheet" href="css/fallback.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="space-bg" aria-hidden="true"></div>
  <div id="stage" class="stage">
    <img id="poster" class="poster" alt="" decoding="async" fetchpriority="high" onerror="this.style.visibility='hidden'">
    <script>
      /* Póster con la proporción más cercana a la del escenario y el mismo punto focal que la cámara 3D.
         La lista la reescribe tools/regenerar-poster.mjs: [nombre, ancho/alto, foco x %, foco y %]. */
      (function () {
        var P = /*POSTERS*/[["9x19.5", 0.4615, 46.1, 46.6], ["9x16", 0.5625, 45.3, 43.8], ["3x4", 0.7504, 47.5, 43.3], ["16x9", 1.7778, 43.8, 54.1]]/*/POSTERS*/;
        // vitrina (?showcase=1): el escenario ocupa todo el iframe; la clase se pone aquí para medirlo ya
        if (/[?&]showcase=1\b/.test(location.search)) document.documentElement.classList.add("is-showcase");
        var s = document.getElementById("stage"), a = s.clientWidth / Math.max(1, s.clientHeight), b = P[0];
        for (var i = 1; i < P.length; i++) if (Math.abs(Math.log(P[i][1] / a)) < Math.abs(Math.log(b[1] / a))) b = P[i];
        var img = document.getElementById("poster");
        img.style.setProperty("--focus", b[2] + "% " + b[3] + "%");
        img.src = "assets/poster/poster-" + b[0] + ".webp";
      })();
    </script>
    <canvas id="gl" class="gl" role="img" aria-label="Película espacial: el astronauta y Gloobi viajan por el espacio. Toda la información de la fiesta está en texto en las tarjetas y en la Bitácora."></canvas>
    <div id="fade" class="fade" aria-hidden="true"></div>
    <div id="ui" class="ui"></div>
  </div>
  <main id="scroller" class="scroller" aria-label="Capítulos de la misión"></main>
  <noscript><p class="noscript">Esta invitación necesita JavaScript. Fiesta de Luis Arturo · Sábado 14 de noviembre, 4:00 pm · Jardín Diversión, Calle Moneda No. 24, Col. Anzures, CDMX.</p></noscript>
</body>
</html>
