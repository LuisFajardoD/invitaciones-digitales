<!doctype html>
<html lang="es" class="me">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E1B4B">
  <!-- Metadatos estáticos: WhatsApp/Facebook no ejecutan JS. En la app real el servidor debe rellenarlos desde demoData. -->
  <title>Misión Luis Arturo · ¡Cumple 8!</title>
  <meta name="description" content="¡Estás invitado a la Misión Luis Arturo! Una película espacial para celebrar sus 8 años: fecha, lugar y confirmación de asistencia.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Misión Luis Arturo · ¡Cumple 8!">
  <meta property="og:description" content="Mantén presionado para encender motores y únete a la tripulación.">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fuentes sin bloquear el primer pintado ni el arranque (una hoja externa lenta retrasaba todo varios segundos);
       main.js espera las fuentes, con tope, antes de dibujar textos en la escena -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/overlay.css">
  <link rel="stylesheet" href="css/bitacora.css">
  <link rel="stylesheet" href="css/crew.css">
  <link rel="stylesheet" href="css/fallback.css">
  <!-- Pantalla de carga (en línea: se pinta al instante, sin esperar a Three.js). Aparece sólo si la carga pasa de
       ~400 ms (si no, la portada entra directo sin parpadeo). La barra sigue la carga real (main.js → __loader.set). -->
  <style>
    .loader { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: #FFF7EC; background: radial-gradient(70% 45% at 50% 42%, #3B2A7A 0%, #1E1B4B 70%); font-family: "Fredoka", "Figtree", system-ui, sans-serif; opacity: 0; transition: opacity .35s ease-out; pointer-events: none; }
    .loader.is-on { opacity: 1; }
    .loader.is-out { opacity: 0; transition-duration: .4s; }
    .loader.is-out .ld-gloobi { transform: scale(.86); }
    .ld-stars { position: absolute; inset: 0; overflow: hidden; }
    .ld-stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #FFF7EC; box-shadow: 0 0 6px #FFF7EC; animation: ld-tw 2.4s ease-in-out infinite; }
    @keyframes ld-tw { 50% { opacity: .2; transform: scale(.6); } }
    .ld-gloobi { position: relative; width: 150px; height: 150px; margin-bottom: 6px; transition: transform .4s ease; }
    .ld-gloobi svg { width: 100%; height: 100%; animation: ld-float 3.2s ease-in-out infinite; overflow: visible; }
    @keyframes ld-float { 50% { transform: translateY(-8px); } }
    .ld-z { position: absolute; left: 70%; top: 18%; font-weight: 600; font-size: 18px; color: #FFF7EC; opacity: 0; animation: ld-z 2.7s ease-in-out infinite; }
    .ld-z:nth-of-type(2) { animation-delay: .9s; font-size: 14px; } .ld-z:nth-of-type(3) { animation-delay: 1.8s; font-size: 11px; }
    @keyframes ld-z { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(22px, -46px); } }
    .ld-title { margin: 0; font-weight: 600; font-size: 22px; }
    .ld-phrase { margin: 0; min-height: 1.4em; font-family: "Figtree", system-ui, sans-serif; font-weight: 600; font-size: 15px; color: rgba(255, 247, 236, .78); transition: opacity .25s; }
    .ld-bar { width: min(220px, 60vw); height: 6px; margin-top: 8px; border-radius: 999px; background: rgba(255, 247, 236, .16); overflow: hidden; }
    .ld-bar i { display: block; width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--theme-2, #45C4D9), var(--theme-hi, #92ADEE)); transform-origin: left; transform: scaleX(.04); transition: transform .35s ease; }
    .is-showcase .loader { display: none; }
    .rm .ld-gloobi svg, .rm .ld-z, .rm .ld-stars i { animation: none; }
    .rm .ld-gloobi, .rm .loader.is-out .ld-gloobi { transform: none; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="space-bg" aria-hidden="true"></div>
  <div id="stage" class="stage">
    <img id="poster" class="poster" alt="" decoding="async" fetchpriority="high" onerror="this.style.visibility='hidden'">
    <div id="loader" class="loader">
      <div class="ld-stars" aria-hidden="true"><i style="left:12%;top:18%"></i><i style="left:78%;top:14%;animation-delay:.6s"></i><i style="left:30%;top:72%;animation-delay:1.1s"></i><i style="left:86%;top:62%;animation-delay:1.7s"></i><i style="left:58%;top:28%;animation-delay:.3s;width:2px;height:2px"></i><i style="left:20%;top:45%;animation-delay:1.4s;width:2px;height:2px"></i><i style="left:68%;top:84%;animation-delay:.9s;width:2px;height:2px"></i><i style="left:44%;top:10%;animation-delay:2s;width:2px;height:2px"></i></div>
      <div class="ld-gloobi" aria-hidden="true">
        <!-- Gloobi dormido: mismos colores, cara y anillo que el 3D (gloobi.js / illustrations.js) -->
        <svg viewBox="0 0 200 200">
          <defs>
            <radialGradient id="ld-h"><stop offset="0" stop-color="#8ED8F8" stop-opacity=".5"/><stop offset="1" stop-color="#8ED8F8" stop-opacity="0"/></radialGradient>
            <radialGradient id="ld-b" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#B7E8FC"/><stop offset=".6" stop-color="#8ED8F8"/><stop offset="1" stop-color="#6FC3EA"/></radialGradient>
          </defs>
          <circle cx="100" cy="100" r="96" fill="url(#ld-h)"/>
          <ellipse cx="100" cy="100" rx="68" ry="18" transform="rotate(-18 100 100)" fill="none" stroke="#E0A94A" stroke-width="6"/>
          <circle cx="100" cy="100" r="44" fill="url(#ld-b)"/>
          <circle cx="80" cy="78" r="10" fill="#B7E8FC" opacity=".8"/><circle cx="124" cy="120" r="8" fill="#6FC3EA" opacity=".7"/>
          <path d="M78 98q7 6 14 0M108 98q7 6 14 0" fill="none" stroke="#1E1B4B" stroke-width="3.6" stroke-linecap="round"/>
          <ellipse cx="75" cy="108" rx="7" ry="4" fill="#FF8FA3" opacity=".75"/><ellipse cx="125" cy="108" rx="7" ry="4" fill="#FF8FA3" opacity=".75"/>
          <ellipse cx="100" cy="113" rx="2.4" ry="1.8" fill="none" stroke="#1E1B4B" stroke-width="1.8"/>
          <path d="M35 121A68 18 -18 0 0 165 79" fill="none" stroke="#FFC96B" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <span class="ld-z">z</span><span class="ld-z">z</span><span class="ld-z">z</span>
      </div>
      <p class="ld-title" role="status">Preparando la misión…</p>
      <p class="ld-phrase" id="ld-phrase" aria-hidden="true">Revisando el traje espacial…</p>
      <div class="ld-bar" aria-hidden="true"><i id="ld-fill"></i></div>
    </div>
    <script>
      (function () {
        var showcase = /[?&]showcase=1\b/.test(location.search);
        // vitrina (?showcase=1): el escenario ocupa todo el iframe; la clase se pone aquí para medirlo ya
        if (showcase) document.documentElement.classList.add("is-showcase");
        var img = document.getElementById("poster");
        if (showcase) {
          /* Póster (sólo en la vitrina del home: fondo mientras carga; la escena lo reemplaza con un fundido cuando está
             lista). Proporción más cercana a la del escenario y mismo punto focal que la cámara 3D. La lista la
             reescribe tools/regenerar-poster.mjs: [nombre, ancho/alto, foco x %, foco y %]. */
          var P = /*POSTERS*/[["9x19.5", 0.4615, 48.4, 51], ["9x16", 0.5625, 48.1, 51.1], ["3x4", 0.7504, 47.6, 51.5], ["16x9", 1.7778, 48.2, 52.1]]/*/POSTERS*/;
          var s = document.getElementById("stage"), a = s.clientWidth / Math.max(1, s.clientHeight), b = P[0];
          for (var i = 1; i < P.length; i++) if (Math.abs(Math.log(P[i][1] / a)) < Math.abs(Math.log(b[1] / a))) b = P[i];
          img.style.setProperty("--focus", b[2] + "% " + b[3] + "%");
          img.src = "assets/poster/poster-" + b[0] + ".webp";
        } else img.remove(); // en la invitación el póster ya no se muestra (ni se descarga)
        // pantalla de carga: frases que rotan y progreso (el valor real lo da main.js)
        var L = document.getElementById("loader"), fill = document.getElementById("ld-fill"), ph = document.getElementById("ld-phrase");
        var phrases = ["Revisando el traje espacial…", "Llenando el tanque de estrellas…", "Despertando a Gloobi…", "Encendiendo la Luna…"], k = 0, shown = 0.04;
        var onT = setTimeout(function () { if (L.isConnected && !L.classList.contains("is-out")) L.classList.add("is-on"); }, 400); // sólo si tarda
        var timer = setInterval(function () { ph.style.opacity = "0"; setTimeout(function () { k = (k + 1) % phrases.length; ph.textContent = phrases[k]; ph.style.opacity = "1"; }, 250); }, 1200);
        window.__loader = {
          set: function (p) { p = Math.max(shown, Math.min(1, p)); shown = p; fill.style.transform = "scaleX(" + p.toFixed(3) + ")"; }, // nunca retrocede
          /** ¿Se llegó a mostrar? (si no, la portada entra directo: sin parpadeo) */
          get visible() { return L.classList.contains("is-on"); },
          hide: function () { clearTimeout(onT); clearInterval(timer); if (!L.isConnected) return; if (!L.classList.contains("is-on")) { L.remove(); return; } L.classList.add("is-out"); setTimeout(function () { L.remove(); }, 450); },
          remove: function () { clearTimeout(onT); clearInterval(timer); L.remove(); }
        };
      })();
    </script>
    <canvas id="gl" class="gl" role="img" aria-label="Película espacial: el astronauta y Gloobi viajan por el espacio. Toda la información de la fiesta está en texto en las tarjetas y en la Bitácora."></canvas>
    <div id="fade" class="fade" aria-hidden="true"></div>
    <div id="ui" class="ui"></div>
  </div>
  <main id="scroller" class="scroller" aria-label="Capítulos de la misión"></main>
  <noscript><p class="noscript">Esta invitación necesita JavaScript. Fiesta de Luis Arturo · Sábado 14 de noviembre, 4:00 pm · Jardín Diversión, Calle Moneda No. 24, Col. Anzures, CDMX.</p></noscript>
</body>
</html>
